name: NovaBiz AI Bot Runner

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: novabiz-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 295
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      ADMIN_ID: ${{ secrets.ADMIN_ID }}
      FAL_KEY: ${{ secrets.FAL_KEY }}
      VIDEO_MODEL: alibaba/wan-3.0/reference-to-video
      VIDEO_ASPECT_RATIO: 9:16
      VIDEO_RESOLUTION: 1080p
      VIDEO_MAX_SHOTS: '8'
      VIDEO_MAX_TELEGRAM_MB: '20'
      VIDEO_FONT_NAME: DejaVu Sans
      SEARCH_ENABLED: 'true'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install system video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1 fonts-dejavu

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in TELEGRAM_BOT_TOKEN AI_API_KEY ADMIN_ID FAL_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required repository secret: $name"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi
          echo 'Required secrets are configured.'

      - name: Test configuration and modules
        run: python -m pytest -q

      - name: Syntax check video modules
        run: python -m py_compile video_engine.py video_bot.py

      - name: Start NovaBiz AI
        run: python bot.py
