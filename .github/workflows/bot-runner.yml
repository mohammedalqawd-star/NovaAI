name: NovaBiz AI Bot Runner

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # GitHub-hosted runners are temporary. Restart periodically to keep the bot available.
    - cron: '0 */5 * * *'

concurrency:
  group: novabiz-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 295
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      FALLBACK_AI_API_KEY: ${{ secrets.AI_FALLBACK_API_KEY }}
      AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
      FALLBACK_AI_BASE_URL: ${{ secrets.AI_FALLBACK_BASE_URL }}
      AI_MODEL: ${{ secrets.AI_MODEL }}
      FALLBACK_AI_MODEL: ${{ secrets.AI_FALLBACK_MODEL }}
      ADMIN_ID: ${{ secrets.ADMIN_ID }}
      FREE_CREDITS: ${{ secrets.FREE_CREDITS }}
      VISION_MODEL: ${{ secrets.VISION_MODEL }}
      SEARCH_ENABLED: 'true'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in TELEGRAM_BOT_TOKEN AI_API_KEY ADMIN_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required repository secret: $name"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo 'Add the missing secrets under Settings > Secrets and variables > Actions, then run this workflow again.'
            exit 1
          fi
          echo 'Required secrets are configured.'

      - name: Run tests
        run: python -m pytest -q

      - name: Start NovaBiz AI
        run: python bot.py
