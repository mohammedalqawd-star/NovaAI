name: Nova AI Bot

on:
  workflow_dispatch:
  push:
    branches: [main]

# Keep only one bot instance alive so Telegram polling is not duplicated.
concurrency:
  group: nova-ai-bot
  cancel-in-progress: true

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start Nova AI
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          ADMIN_ID: ${{ secrets.ADMIN_ID || '8960865438' }}
        run: python bot.py
